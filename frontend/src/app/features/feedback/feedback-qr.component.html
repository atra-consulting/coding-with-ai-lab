<div class="qr-page">
  <div class="qr-card">
    <div class="qr-header">
      <div class="logo">
        <img src="assets/images/atra_logo.svg" alt="atra.consulting Logo" />
      </div>
      <h1>Feedback zur Schulung</h1>
      <p class="subtitle">Agentic Engineering Bootcamp &mdash; 03.&ndash;04.09.2026</p>
    </div>

    <div class="qr-body">
      <div class="qr-inputs">
        <div class="qr-input-group">
          <label for="schulung-input">Schulungsname</label>
          <input
            id="schulung-input"
            type="text"
            maxlength="200"
            [(ngModel)]="schulungInput"
            (ngModelChange)="onInputChange()"
            autocomplete="off"
          />
        </div>
        <div class="qr-input-group">
          <label for="trainer-input">Trainer</label>
          <input
            id="trainer-input"
            type="text"
            maxlength="200"
            [(ngModel)]="trainerInput"
            (ngModelChange)="onInputChange()"
            autocomplete="off"
          />
        </div>
      </div>

      <p class="scan-text">QR-Code scannen und Feedback geben</p>
      <div class="qr-wrapper">
        <canvas #qrCanvas></canvas>
      </div>
      <p class="url-text">{{ feedbackUrl() }}</p>
    </div>

    <div class="qr-footer">
      <p>Trainer: David Kreutzer, Daniel Wochnik, Benjamin Steimer</p>
      <p class="brand">Made by <a href="https://atra.consulting/" target="_blank" rel="noopener noreferrer">atra.consulting</a></p>
    </div>
  </div>
</div>
