name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # --- Backend ---

      - name: Backend — install dependencies
        working-directory: backend
        run: npm ci

      - name: Backend — type-check backend sources
        working-directory: backend
        run: npx tsc --noEmit

      - name: Backend — run Playwright API tests
        working-directory: backend
        run: npx playwright test

      # --- Frontend ---

      # These run even after a backend step failed, so one run reports both halves
      # of the suite. Before this, a red backend step skipped everything below it:
      # 19 broken frontend tests sat unnoticed on main behind a failing backend
      # test, and only surfaced once that backend test was fixed (PR #143 / #144).
      # !cancelled() rather than always() — a cancelled run must still stop.

      - name: Frontend — install dependencies
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm ci

      - name: Frontend — run unit tests (CI)
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npm run test:ci

      - name: Frontend — build
        if: ${{ !cancelled() }}
        working-directory: frontend
        run: npx ng build

